name: Update data & deploy

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always build on the latest main, even when re-running an old run
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build data snapshot
        run: node scripts/update-data.mjs
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/snapshot.json "$RUNNER_TEMP/snapshot.json"
          for attempt in 1 2 3; do
            # Re-apply the fresh snapshot on top of whatever main is now, so concurrent pushes never block us.
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/snapshot.json" data/snapshot.json
            git add data/snapshot.json
            if git diff --cached --quiet; then echo "Snapshot unchanged"; exit 0; fi
            git commit -q -m "data: refresh snapshot"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Could not push snapshot after 3 attempts"; exit 1
      - name: Check GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages not enabled::Data was refreshed, but the site was not deployed. Enable it under Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    if: needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
